[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xbum"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<3", "alembic>=1.14,<2", "argon2-cffi>=23.1", "python-multipart>=0.0.20",
  "pillow>=11,<13", "pillow-heif>=0.21", "imagehash>=4.3", "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5", "httpx>=0.28,<1", "lunardate>=0.2.2", "psutil>=6"
]
[project.optional-dependencies]
ai = ["torch>=2.6,<3", "transformers>=4.51,<5", "sentencepiece>=0.2", "safetensors>=0.5", "protobuf>=5"]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["apps/api"]
[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]
[tool.ruff]
target-version = "py311"
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S306"]
ignore = ["B008"]
